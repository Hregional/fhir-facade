services:
  fhir-server:
    build:
      context: .
      args:
        MAVEN_OPTS: ${MAVEN_OPTS:-}
    container_name: hapi-fhir-facade
    ports:
      - "${DOCKER_PORT}:8080"
    env_file:
      - .env
    # Limites de memoria configurables desde .env (MEM_LIMIT y JAVA_OPTS).
    # Deja ~250MB entre -Xmx y MEM_LIMIT para memoria fuera del heap (metaspace, threads).
    environment:
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseSerialGC}"
    mem_limit: ${MEM_LIMIT:-768m}
    restart: always
    networks:
      - hro-net

networks:
  hro-net:
    external: true
